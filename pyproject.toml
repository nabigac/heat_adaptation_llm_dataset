[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-adaptation-llm-dataset"
version = "0.1.0"
description = "An expert-LLM workflow for extracting source-linked heat adaptation data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Async HTTP lets one deadline cover connection, waiting, and response reads.
    "httpx>=0.28.1,<0.29",
    # Count rendered requests using the tokenizer already bundled with Ollama's model.
    "tokenizers>=0.22,<0.23",
    "jsonschema>=4.26,<5",
    # Resolve the shared content schema locally when checking agent responses.
    "referencing>=0.37,<1",
    # Recognize rendered page text locally when native PDF extraction fails.
    "easyocr>=1.7.2,<2",
    # Native extraction remains the first choice before rendering or OCR.
    "pypdf>=6.21.4,<7",
    # PDFium renders pages; Pillow encodes those images as PNG for later tools.
    "pypdfium2>=5,<6",
    "pillow>=12,<14",
    # Enable jsonschema's optional date-time checker for preparation timestamps.
    "rfc3339-validator>=0.1.4,<0.2",
]

[project.scripts]
# Installation creates a terminal command that calls main() in src/cli.py.
heat-adaptation-llm-dataset = "cli:main"

[dependency-groups]
# Test tools support development; the workflow itself does not need them to run.
dev = [
    "pytest>=9,<10",
]

[tool.setuptools]
# Install the design's flat src/ modules explicitly. uv sync uses an editable
# development install; release packaging of schema resources is a later step.
package-dir = {"" = "src"}
py-modules = ["agents", "cli", "document_tools", "documents", "models", "repair", "storage", "validation"]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let tests import modules from the design's src/ directory.
pythonpath = ["src"]
